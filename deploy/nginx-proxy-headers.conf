# 反代请求头（被 nginx-prod.conf 的每个 location include）。
#
# 关键点：**覆写而不是追加**。
#   `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for` 会把客户端
#   自带的 XFF 拼在前面 —— 攻击者只要发一个
#   `X-Forwarded-For: 1.2.3.4` 就能让应用看到假 IP，登录锁、IP 封禁、
#   票据绑定全部失效。这里用 `$remote_addr` 直接覆盖。
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";
