# ---------------------------------------------------------------------------
# 生产 nginx 模板（会话加固版，2026-11-05）
#
# 设计原则：**默认拒绝，显式放行**。
#   `location / { return 404; }` 放在最后，新增路径必须手动加，不会因为
#   上游加了一个路由就自动对公网可见。
#
# 使用：
#   cp deploy/nginx-prod.conf /etc/nginx/conf.d/wb2api.conf
#   替换 <prod-domain> / 证书路径 → nginx -t → reload
#
# 与应用侧的分工：
#   * 应用只绑 127.0.0.1:8790，公网流量必须经过这里（TLS、限流、封禁）；
#   * 应用自己也有一层 `env_guard.PROD_BLOCKED_PREFIXES`，
#     两边同时挡 —— 只靠 nginx 会在换机/漏配时失效。
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=wb_admin:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=wb_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=wb_conn:10m;

# 只记录"方法 + 路径"，**不记录 query string**。
# 原因：即使应用层已经禁止把凭证放 query，日志格式也不该给它留位置 ——
# 一次误改就会把邀请码/票据写进磁盘并保留 30 天。
log_format wb_noquery '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name <prod-domain>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <prod-domain>;

    ssl_certificate     /etc/letsencrypt/live/<prod-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<prod-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/wb2api.access.log wb_noquery;
    error_log  /var/log/nginx/wb2api.error.log warn;

    client_max_body_size 64m;     # 与 /api/accounts/import 的实际上限对齐
    server_tokens off;

    limit_conn wb_conn 40;

    # 安全响应头由应用统一下发（CSP/nosniff/frame-options），
    # 这里只补 nginx 层能提供的两个。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- 明确拒绝的路径 -------------------------------------------------
    # 生产镜像里根本不存在这些文件，这里再挡一次是防止"打包时多拷了"。
    location ~ /\.(env|git|svn|htaccess) { return 404; }
    location ~ ^/(_backup|_scratch|backups|tests|docs|deploy|build|dist)/ { return 404; }
    location ~* \.(db|sqlite|sqlite3|log|pyc|pyo)$ { return 404; }
    location ~ ^/(api/app-source|api/client-paths|api/client-profile)/ { return 404; }
    location ~ ^/api/maintenance/(restore|restart|backup/dir) { return 404; }
    location ~ ^/api/accounts/.*/(inject|scan-local|import-local) { return 404; }
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }

    # ---- 自助注册 -------------------------------------------------------
    # 关闭 access_log：这里是唯一可能出现"一次性票据"的入口。
    # 票据在 fragment 里本来就不上送，这条是防止将来有人误加 query 参数。
    location = /j {
        access_log off;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }
    location ^~ /join {
        access_log off;
        limit_req zone=wb_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }
    location ^~ /api/join/ {
        access_log off;
        limit_req zone=wb_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }

    # ---- 后台 -----------------------------------------------------------
    location /admin {
        limit_req zone=wb_admin burst=30 nodelay;
        limit_conn wb_conn 15;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=wb_admin burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        # SSE（请求动态 / 用量推送）需要长连接与关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 660s;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }
    location /authorize {
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }

    # ---- 网关（API Key 鉴权，长连接）------------------------------------
    location /v1/ {
        limit_req zone=wb_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }
    location /mcp {
        limit_req zone=wb_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_buffering off;
        proxy_read_timeout 660s;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }

    # ---- 静态资源（登录壳 / 图标）---------------------------------------
    location /static/ {
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/wb2api-proxy-headers.conf;
    }

    # ---- 默认拒绝 -------------------------------------------------------
    location / { return 404; }
}
